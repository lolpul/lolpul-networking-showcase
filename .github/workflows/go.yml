name: Go examples

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - run: test -z "$(gofmt -l examples)"
      - run: go vet ./...
      - run: go test -timeout 30s ./...
      - run: go test -race -timeout 30s ./...
